name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate-and-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install asyncua==1.1.6 zeroconf==0.132.2

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          paths = [
            'custom_components/opcua_machine/manifest.json',
            'custom_components/opcua_machine/strings.json',
            'custom_components/opcua_machine/translations/en.json',
            'custom_components/opcua_machine/translations/de.json',
          ]
          for p in paths:
            with open(p, 'r', encoding='utf-8') as f:
              json.load(f)
          print('JSON validation: PASS')
          PY

      - name: Compile Python files
        run: |
          python -m py_compile \
            custom_components/opcua_machine/*.py \
            testbed/opcua-sim/server.py \
            tests/ci_smoke.py

      - name: Run smoke test
        run: |
          python tests/ci_smoke.py
