name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate-and-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install asyncua==1.2b2 zeroconf==0.132.2 pytest pytest-asyncio coverage ruff

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          paths = [
            'custom_components/opcua/manifest.json',
            'custom_components/opcua/strings.json',
            'custom_components/opcua/translations/en.json',
            'custom_components/opcua/translations/de.json',
          ]
          for p in paths:
            with open(p, 'r', encoding='utf-8') as f:
              json.load(f)
          print('JSON validation: PASS')
          PY

      - name: Compile Python files
        run: |
          python -m py_compile \
            custom_components/opcua/*.py \
            testbed/opcua-sim/server_all_entities.py \
            testbed/opcua-sim/server_basic256.py \
            testbed/opcua-sim/server_basic256_userpass.py \
            testbed/opcua-sim/server_device_split.py \
            tests/ci_smoke.py

      - name: Run component tests
        run: |
          PYTHONPATH=. pytest tests/components/opcua -q

      - name: Run coverage report
        run: |
          PYTHONPATH=. coverage run -m pytest tests/components/opcua -q
          PYTHONPATH=. coverage report -m

      - name: Run Ruff
        run: |
          ruff check custom_components/opcua tests/components/opcua tests/ci_smoke.py

      - name: Run smoke test
        run: |
          python tests/ci_smoke.py
